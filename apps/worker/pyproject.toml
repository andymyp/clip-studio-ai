[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "clipstudio-worker"
version = "0.1.0"
description = "ClipStudio AI media worker foundation"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.139.2,<1",
  "uvicorn[standard]>=0.51,<1",
  "pydantic-settings>=2.14.2,<3",
  "redis>=8.0.1,<9",
  "yt-dlp[default,curl-cffi]==2026.7.4",
  "faster-whisper>=1.2.1,<2",
  "opencv-python-headless>=4.13,<5",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.9,<3",
  "mypy>=2.3,<3",
  "pytest>=9.1.1,<10",
  "ruff>=0.16,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
